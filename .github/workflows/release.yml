name: Publish Library to Repository
on:
  push:
    branches:
      - develop
      - main

jobs:
  publish-jar:
    runs-on: ubuntu-latest

    steps:
      - name: "GIT: Checkout Action Version"
        uses: actions/checkout@v3

      - name: "JAVA: Set Up JAVA Version 17"
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "GRADLE: Publish Library"
        run: ./gradlew publish
        env:
          GIT_PUBLISH_USER: ${{ vars.GIT_PUBLISH_USER }}
          GIT_PUBLISH_PASSWORD: ${{ secrets.GIT_PUBLISH_PASSWORD }}
